[project]
name = "act-prm"
version = "0.1.0"
description = "Action Process Reward Models (Act-PRM) — infer latent thoughts behind logged actions via an offline EM, trained in PyTorch with LoRA."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # config / plumbing
    "python-dotenv",
    "omegaconf",
    "rich",
    "tqdm",
    "pydantic",
    # numerics / data
    "numpy",
    "pandas",
    "matplotlib",   # analysis notebooks (notebooks/cc-*.ipynb)
    # local HF training stack (main_pytorch.py path)
    "torch",
    "transformers>=4.51",
    "datasets",
    "peft",
    "safetensors",
    "accelerate",
    # logging (ml_log used by the trainer / main_pytorch)
    "tinker-cookbook>=0.4.3",
    "wandb>=0.28.0",
]

[project.optional-dependencies]
# Only needed to reproduce the original Tinker training path in scripts/ + notebooks.
tinker = [
    "tinker>=0.22.7",
]
# tau2-bench RL environment (real tasks/tools/evaluator) + the litellm user-sim path.
# Install into a dedicated venv while other runs use the base .venv:
#   UV_PROJECT_ENVIRONMENT=.venv-tau2 uv sync --extra tau2
tau2 = [
    "tau2",
    "scipy>=1.10.0",
    "gymnasium>=1.2.0",
    "litellm",
    "openai",
    "claude-agent-sdk",   # user simulator over Claude Code OAuth (claude_agent_sdk/<model>)
]

[tool.uv.sources]
# Local clone of sierra-research/tau2-bench @ v1.0.0 (github is blocked by fwdproxy,
# so it's cloned to ./tau2-bench and installed from the path; not committed).
tau2 = { path = "tau2-bench" }

[build-system]
requires = ["uv_build>=0.11.27,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Distribution is `act-prm`; the import package is `act_prm` under src/.
module-name = "act_prm"
module-root = "src"

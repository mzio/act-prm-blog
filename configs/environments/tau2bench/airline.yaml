# tau2-bench airline domain (real tasks/tools/evaluator), for agentic RL.
# User simulator + NL-assertion judge run over the Llama-API passthrough
# (metagen/<model>) — see environments/tau2bench/litellm_metagen.py.
name: "tau2bench"
data_path: "tau2-bench/data"
domain: "airline"
task_split: null
is_async: true
negative_rewards: true
eval_splits: ["eval"]

# User simulator + judge (Llama-passthrough; needs LLAMA_API_KEY = LLM|<id>|<secret>).
# gpt-oss-120b is a one-line swap once an entitlement allowlists it.
user_llm: "claude_agent_sdk/claude-haiku-4-5"
user_llm_args: {temperature: 0.0, max_tokens: 512}
nl_assertions_llm: "claude_agent_sdk/claude-haiku-4-5"
env_interface_llm: "claude_agent_sdk/claude-haiku-4-5"

max_steps: 50               # tau2 AgentGymEnv step cap
num_train_tasks: 40
num_val_tasks: null
num_test_tasks: 10

# Explicit task-id selection (Stage-3 RL). When non-null, the train/eval splits
# are EXACTLY these tau2 task ids, overriding the count-based split above. Null =>
# count-based (unchanged). Parity with retail: the airline box wires its own
# logged / never-in-logs id lists here (via its Stage-3 script).
train_task_ids: null
eval_task_ids: null

# State compaction (wrapper-level)
hide_observations: false
hidden_obs_content: "..."
first_obs_to_show: 1
last_obs_to_show: 0

max_turns: 30               # wrapper truncation (override lower for VRAM, e.g. --max_turns 8)
num_tries: 1
eval_num_tries: 1
seed: 0
data_seed: 0
split: "train"
system_prompt: "You are a helpful customer service agent."
truncation_message: "Sorry, you have reached the maximum number of steps. Please try again."
verbose: false

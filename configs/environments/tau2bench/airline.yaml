# tau2-bench airline domain (real tasks/tools/evaluator), for agentic RL.
# User simulator + NL-assertion judge run over the Llama-API passthrough
# (metagen/<model>) — see environments/tau2bench/litellm_metagen.py.
name: "tau2bench"
data_path: "data/tau2/_repo/data"
domain: "airline"
task_split: null
is_async: true
negative_rewards: true
eval_splits: ["eval"]

# User simulator + judge (Llama-passthrough; needs LLAMA_API_KEY = LLM|<id>|<secret>).
# gpt-oss-120b is a one-line swap once an entitlement allowlists it.
user_llm: "metagen/openai-gpt-5-5-responses"
user_llm_args: {temperature: 0.0, max_tokens: 512}
nl_assertions_llm: "metagen/openai-gpt-5-5-responses"
env_interface_llm: "metagen/openai-gpt-5-5-responses"

max_steps: 50               # tau2 AgentGymEnv step cap
num_train_tasks: 40
num_val_tasks: null
num_test_tasks: 10

# State compaction (wrapper-level)
hide_observations: false
hidden_obs_content: "..."
first_obs_to_show: 1
last_obs_to_show: 0

max_turns: 30               # wrapper truncation (override lower for VRAM, e.g. --max_turns 8)
num_tries: 1
eval_num_tries: 1
seed: 0
data_seed: 0
split: "train"
system_prompt: "You are a helpful customer service agent."
truncation_message: "Sorry, you have reached the maximum number of steps. Please try again."
verbose: false

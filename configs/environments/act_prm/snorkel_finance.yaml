# Logged action-only trajectories: Snorkel Agent Finance reasoning traces.
# The Act-PRM generator infers the latent thought behind each logged action.
name: "act_prm_traces"

dataset: "mzio/aprm-snorkelai_agent_finance_reasoning"
dataset_path: null          # set (or --dataset_path DIR) to persist/reuse pools offline
synthetic: false            # true (or --synthetic) uses built-in offline traces

num_trajectories: 64        # logged train trajectories to stream
eval_trajectories: 8        # held-out eval trajectories
max_traj_timestep: 8        # only keep trajectories that finished within this many steps
max_steps_per_traj: null    # null -> infer a thought for EVERY logged action in the trajectory
obs_max_chars: null         # null -> no truncation (keep full observations); set an int to cap
# Observation hiding is OFF for thought generation — the E-step sees the full
# (length-capped) observations so inferred thoughts are well grounded. The
# compaction below (system + first user + last obs + all model messages) is
# reserved for the downstream SFT / RL training contexts.
hide_observations: false    # true hides intermediate observations (SFT/RL setup)
first_obs_to_show: 1        # (when hide_observations) keep the first N observations
last_obs_to_show: 1         # (when hide_observations) keep the last N observations

# Base Environment knobs
num_tries: 1
seed: 0

# Snorkel Agent Finance (split-based), action-only for Act-PRM.
# Uses a task-level split: act_prm_train + act_prm_eval are loaded; the rl_eval
# tasks are held out (never seen by act-prm) for eventual RL evaluation.
name: "act_prm_traces"

dataset: "mzio/aprm-snorkelai_agent_finance_reasoning"
split_file: "data/splits/snorkel_finance.json"
# v3 is the QUESTION-level subselection: the uid-level pool in data/snorkel_finance_split
# leaks (76% of its eval questions also appear in train, 91% of rl_eval), so eval likelihood
# measured on it is contaminated. It must also match the --source-pools the Stage-1 driver
# passes to export_sft_corpus.py; when the two disagreed (08-28) the export silently resolved
# only 3/25 eval and 94/116 train trajectories.
dataset_path: "data/snorkel_finance_split_v3"   # first run streams via split + caches; reruns load offline
synthetic: false
keep_expert_thoughts: false # true keeps original expert reasoning+action per turn (expert thought-action SFT; use a distinct dataset_path)

num_trajectories: null      # use all act_prm_train tasks in the split
eval_trajectories: null     # use all act_prm_eval tasks in the split
max_steps_per_traj: null    # infer a thought for every logged action
obs_max_chars: null         # full observations (cap with an int if VRAM-constrained)

# Observation hiding OFF for thought generation (reserved for downstream SFT/RL)
hide_observations: false
first_obs_to_show: 1
last_obs_to_show: 1

num_tries: 1
seed: 0

# Snorkel Insurance underwriting (action-only) for Act-PRM Stage-1 EM + Stage-2 SFT.
#
# Source rollouts: mzio/aprm-insurance-gpt5m_med-gs4-s0-r1-train -- a STEP-level GPT-5-mini
# replay buffer (13,131 steps / 1,000 trajectories / 262 questions, group_size 4).
# scripts/build_insurance_pools.py reconstructs trajectories, keeps only the SUCCESSFUL ones
# (910/1000 = 91%, covering 261/262 questions), and writes the pools this config reads.
#
# The split is by QUESTION and three-way disjoint (180 train / 40 eval / 41 rollout); the
# rollout questions are never seen by Stage 1 or Stage 2. Splitting at question level is
# deliberate: the finance v1 split partitioned uids, and because ~2.5 uids shared each
# question it leaked 76% of eval and 91% of the RL hold-out into train.
#
# Pools are capped at ONE demonstration per question (180 traj / 2,273 steps, from an
# available 631 / 8,037). Retail's thought pools kept up to two generations per task, which
# gave the thought arms 1043 supervised steps against the baseline's 635 and forced a
# separate volume-matched control to disentangle "thoughts help" from "more data helps".
# One-per-question makes every arm volume-matched by construction.
name: "act_prm_traces"

dataset: "mzio/aprm-insurance-gpt5m_med-gs4-s0-r1-train"
split_file: "data/splits/snorkel_insurance.json"
dataset_path: "data/snorkel_insurance_split"       # prebuilt by build_insurance_pools.py
synthetic: false
keep_expert_thoughts: false  # true -> expert reasoning+action targets; pair with the
                             # data/snorkel_insurance_split_expert_thoughts pool

num_trajectories: null       # all 180 train questions
eval_trajectories: null      # all 40 eval questions
max_steps_per_traj: null     # infer a thought for every logged action
obs_max_chars: null          # full observations (cap with an int if VRAM-constrained)

# Observation hiding OFF for thought generation (reserved for downstream SFT/RL).
hide_observations: false
first_obs_to_show: 1
last_obs_to_show: 1

num_tries: 1
seed: 0

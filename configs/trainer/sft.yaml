# Supervised fine-tuning trainer for Act-PRM.
# Same rollout/eval/checkpoint loop as pg, but compute_loss is plain
# (advantage-weighted) cross-entropy on the (thought+action) span — no PPO ratio.
# Pair with a generator advantage_mode:
#   - best      : MLE SFT on the single best thought per group
#   - em        : soft-distill (EM-weighted over the group)
#   - top_half  : train on the better half of the group (uniform)
#   - uniform   : train on all G thoughts equally
# or with generator.infer_thoughts=false for the actions-only baseline.
trainer_name: sft
supervised_fine_tuning: true
balance_advantages: false

model_name: null

tool_call_kwargs:
  tool_call_bos: "<tool_call>"
  tool_call_eos: "</tool_call>"
  tool_call_argname: "arguments"

# Generation (E-step rollouts)
num_batches: 200
num_tries: null
eval_num_tries: null
max_tokens: 1024
temperature: 1.0
max_input_id_len: null
max_seq_len: 8192

batch_size: 8
group_size: 4
eval_group_size: 1
num_return_sequences: null

# Training (M-step policy updates)
learning_rate: 4e-5
# MUST be declared here: update_configs only applies a CLI flag whose key already exists in
# a config, so without this line --optimizer is silently dropped. Left at sgd to preserve
# the behaviour every existing result was produced under; pass --optimizer adamw explicitly.
optimizer: "sgd"
# Keep a numbered step_NNNN snapshot each save_every batches (~253MB each at r32), in
# addition to the overwritten step_last. Without this an early good checkpoint is lost.
keep_step_checkpoints: true
discount_factor: 0.9
loss_fn: "cross_entropy"
num_substeps: 1
mini_batch_size: null
dataloader_batch_size: 1
# Drop zero-advantage samples from the batch (best/top_half train only the kept
# thoughts; without this the dropped thoughts waste compute + dilute the update).
drop_zero_advantage: true

compute_post_kl: false
kl_penalty_coef: 0.0
kl_discount_factor: 0.0

# Checkpointing / eval
eval_every: 10
save_every: 20
no_initial_eval: false
# best_metric selects the step_best checkpoint on the eval metric whose key
# contains this substring. "eval_action_ppl" -> lowest action-token perplexity
# over act_prm_eval (offline SFT early-stop); "eval_action_accuracy" -> highest
# target-token argmax accuracy; "final_reward" (default) -> mean p(x|s,z).
best_metric: "final_reward"

# Rollout saving
save_rollouts_every: 0
num_tasks_per_save: null
save_rollouts_to_hub: false

# Other
base_url: null
log_path: "./logs"
load_checkpoint_path: null
checkpoint_path: "./checkpoints"
push_to_hub: false
wandb_project: null
wandb_name: null

# Supervise ONLY the action tokens (<tool_call>...</tool_call> or a "Final Answer:"
# suffix), masking the reasoning prefix out of the loss. The thought stays in the
# INPUT and still conditions the prediction — we just take no gradient on producing
# it. This makes the trained span identical to the span eval_actiononly_* scores, so
# the variants are comparable on a same-span basis; otherwise the thought arms spend
# most of their gradient on tokens the metric never looks at. No-op for actions_only.
train_action_only: false

# Train only on assistant turns with reasoning before the action (see --require_thought).
# Off by default; the expert_thoughts_all arm switches it on.
require_thought: false
